name: Build APK & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Create a GitHub Release with APKs attached'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag name for manual release (e.g., v1.0.0)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            echo "Copying .env.example to .env"
            cp .env.example .env
          fi

      - name: Prepare Keystores for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup Debug Keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Release Keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding secret release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV
          else
            echo "Generating build-time release keystore fallback..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Habit Tracker,OU=Mobile,O=AIStudio,L=MountainView,S=CA,C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs for Clarity
        run: |
          mkdir -p output_apks
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/HabitTracker-release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apks/HabitTracker-debug.apk
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-Release-APK
          path: output_apks/HabitTracker-release.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-Debug-APK
          path: output_apks/HabitTracker-debug.apk
          if-no-files-found: warn

      - name: Determine Release Eligibility
        id: release_check
        run: |
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          MANUAL_RELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.create_github_release }}"
          if [ "$IS_TAG" = "true" ] || [ "$MANUAL_RELEASE" = "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            if [ -n "${{ inputs.release_tag }}" ]; then
              echo "tag_name=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            else
              echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.tag_name }}
          name: Habit Tracker Release ${{ steps.release_check.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            output_apks/HabitTracker-release.apk
            output_apks/HabitTracker-debug.apk
          body: |
            ### Habit Tracker Release
            
            **What's Included:**
            - **HabitTracker-release.apk**: Optimized standalone release build.
            - **HabitTracker-debug.apk**: Debug build with debugging symbols enabled.
            
            **Features:**
            - Contribution Tile Grid visualization (GitHub-style habit matrix)
            - Classic, Compact (5-day routine), and Split view modes
            - Build good habits & Quit bad habits tracking
            - Daily notes, reflection journal, and milestone statistics
            - Scheduled reminders (up to 3 per habit)
            - Pure AMOLED Black, Dark Slate, and Light themes
            - 100% Offline & Private by Design using Room SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
