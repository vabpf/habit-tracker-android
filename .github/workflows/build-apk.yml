name: Build Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: 'Run unit tests before building'
        required: false
        type: boolean
        default: true
      create_github_release:
        description: 'Create a GitHub Release with the Release APK attached'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag name for manual release (e.g., v1.0.0)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache Robolectric SDK jars
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/robolectric
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            echo "Copying .env.example to .env"
            cp .env.example .env
          fi

      - name: Setup Consistent Signing Keystore
        if: ${{ !(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          CUSTOM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Priority 1: User-configured GitHub Secrets
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            echo "Using custom GitHub Secret release keystore..."
            echo "$CUSTOM_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${CUSTOM_STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${CUSTOM_KEY_PASSWORD}" >> $GITHUB_ENV
          # Priority 2: Permanent repository release keystore (consistent certificate for seamless app updates)
          elif [ -f "release.keystore.base64" ]; then
            echo "Using repository release.keystore.base64..."
            base64 -d release.keystore.base64 > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=habittracker2026" >> $GITHUB_ENV
            echo "KEY_PASSWORD=habittracker2026" >> $GITHUB_ENV
          else
            echo "Fallback: generating temporary key..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Habit Tracker,O=HabitTracker,C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_unit_tests }}
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Release APK
        # Plain branch pushes run unit tests only; build runs on tags, PRs, and manual dispatches.
        if: ${{ !(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage Release APK
        if: ${{ !(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        run: |
          mkdir -p output_apks
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/HabitTracker-release.apk
          fi

      - name: Upload Release APK Artifact
        if: ${{ !(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v6
        with:
          name: HabitTracker-Release-APK
          path: output_apks/HabitTracker-release.apk
          if-no-files-found: error

      - name: Determine Release Eligibility
        id: release_check
        run: |
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          MANUAL_RELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.create_github_release }}"
          if [ "$IS_TAG" = "true" ] || [ "$MANUAL_RELEASE" = "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            if [ -n "${{ inputs.release_tag }}" ]; then
              echo "tag_name=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            elif [ "$IS_TAG" = "true" ]; then
              echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            else
              echo "tag_name=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_check.outputs.tag_name }}
          name: Habit Tracker ${{ steps.release_check.outputs.tag_name }}
          draft: false
          prerelease: false
          files: output_apks/HabitTracker-release.apk
          body: |
            ### Habit Tracker Release
            
            **Download:**
            - **[HabitTracker-release.apk](output_apks/HabitTracker-release.apk)**: Signed production release APK with consistent certificate for seamless updates.
            
            **Features:**
            - Contribution Tile Grid visualization (GitHub-style habit matrix)
            - Classic, Compact (5-day routine), and Split view modes
            - Build good habits & Quit bad habits tracking
            - Daily notes, reflection journal, and milestone statistics
            - Scheduled reminders (up to 3 per habit)
            - Pure AMOLED Black, Dark Slate, and Light themes
            - 100% Offline & Private by Design using Room SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
